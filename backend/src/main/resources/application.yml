server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: knowledge-gap-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_gap_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:varnika@2006}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 25MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Security & App Configuration
app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads/resumes}
    cert-dir: ${APP_CERT_UPLOAD_DIR:./uploads/certificates}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ML Microservice Integration
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: 5000

# OpenAI Integration for Assessment Questions
openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: ${OPENAI_API_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: ${OPENAI_TIMEOUT_MS:15000}
    enabled: ${OPENAI_ENABLED:true}

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
